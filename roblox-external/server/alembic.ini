# Alembic configuration for the license server.
#
# The database URL is intentionally NOT stored here. It is read at runtime from
# the DATABASE_URL environment variable (see alembic/env.py) so that no
# credentials ever live in a committed file. To override for a single run:
#
#   DATABASE_URL=postgresql+psycopg://user:pass@host/db alembic upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url = (read from DATABASE_URL at runtime)

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
